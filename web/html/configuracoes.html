<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoSense | Configurações</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app-container"><aside class="sidebar"><div class="logo-area"><h1>🌿 EcoSense</h1></div><nav class="menu"><a class="menu-item" href="dashboard.html">Dashboard</a><a class="menu-item" href="historico.html">Histórico</a><a class="menu-item" href="alertas.html">Alertas</a><a class="menu-item" href="dispositivos.html">Dispositivos</a><a class="menu-item" href="controle.html">Controle</a><a class="menu-item active" href="configuracoes.html">Configurações</a></nav></aside><main class="main-content"><header class="topbar"><div><h2>Limites ambientais</h2><p>Consulte e atualize os limites por dispositivo.</p></div></header><p id="message" role="status"></p><section class="content-card"><form id="limit-form"><label>Dispositivo <input name="device_id" type="number" min="1" required value="1"></label><label>Métrica <select name="metric"><option value="temperature">Temperatura</option><option value="humidity">Umidade</option><option value="luminosity">Luminosidade</option><option value="air_quality">Qualidade do ar</option></select></label><label>Mínimo <input name="min_value" type="number" step="any"></label><label>Máximo <input name="max_value" type="number" step="any"></label><label><input name="enabled" type="checkbox" checked> Ativo</label><button type="submit">Salvar limite</button></form><h3>Limites cadastrados</h3><div id="limits">Carregando…</div></section></main></div><script type="module" src="../js/configuracoes.js"></script></body></html>

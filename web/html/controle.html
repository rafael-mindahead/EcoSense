<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoSense | Controle</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app-container"><aside class="sidebar"><div class="logo-area"><h1>🌿 EcoSense</h1></div><nav class="menu"><a class="menu-item" href="dashboard.html">Dashboard</a><a class="menu-item" href="historico.html">Histórico</a><a class="menu-item" href="alertas.html">Alertas</a><a class="menu-item" href="dispositivos.html">Dispositivos</a><a class="menu-item active" href="controle.html">Controle</a><a class="menu-item" href="configuracoes.html">Configurações</a></nav></aside><main class="main-content"><header class="topbar"><div><h2>Controle de atuadores</h2><p>Envie comandos ao ventilador e ao exaustor.</p></div></header><p id="message" role="status"></p><section class="sensor-grid"><article class="sensor-card"><h3>Ventilador</h3><label>ID do dispositivo <input id="fan-id" type="number" min="1" value="1"></label><button data-actuator="fan" data-command="ON">Ligar</button> <button data-actuator="fan" data-command="OFF">Desligar</button><p id="fan-state">Aguardando comando</p></article><article class="sensor-card"><h3>Exaustor</h3><label>ID do dispositivo <input id="exhaust-id" type="number" min="1" value="1"></label><button data-actuator="exhaust" data-command="ON">Ligar</button> <button data-actuator="exhaust" data-command="OFF">Desligar</button><p id="exhaust-state">Aguardando comando</p></article></section></main></div><script type="module" src="../js/controle.js"></script></body></html>

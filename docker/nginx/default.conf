server {
    listen 80;
    server_name localhost;

    # Backend PHP
    root /var/www/html/public;
    index index.php;

    # Dashboard Web
    location = /dashboard {
    default_type text/html;
    alias /var/www/web/html/dashboard.html;
    }

    # Histórico Web
   location = /historico {
    default_type text/html;
    alias /var/www/web/html/historico.html;
   }

    # Arquivos CSS
    location /css/ {
        alias /var/www/web/css/;
    }

    # Arquivos JavaScript
    location /js/ {
        alias /var/www/web/js/;
    }

    # Rotas da API REST
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;
    }
}

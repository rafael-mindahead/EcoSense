server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Dashboard
    location = /dashboard {
        default_type text/html;
        alias /var/www/web/html/dashboard.html;
    }

    # Dispositivos
    location = /dispositivos {
        default_type text/html;
        alias /var/www/web/html/dispositivos.html;
    }

    # Histórico
    location = /historico {
        default_type text/html;
        alias /var/www/web/html/historico.html;
    }

    # CSS
    location /css/ {
        alias /var/www/web/css/;
    }

    # JavaScript
    location /js/ {
        alias /var/www/web/js/;
    }

    # API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
